[project]
name = "smartsom"
version = "0.1.0"
description = "A modular dynamic flexible job shop simulator scaffold."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.13.4,<3",
    "PyYAML>=6.0.2,<7",
]

[project.scripts]
smartsom = "smartsom.experiments.cli:main"

[project.optional-dependencies]
cp = ["pyjobshop==0.0.9", "ortools==9.12.4544"]
gym = ["gymnasium==1.2.2"]
learning-rllib = ["ray[rllib]==2.58.0", "gymnasium==1.2.2", "torch==2.14.0"]
learning-sb3 = ["stable-baselines3==2.9.0", "sb3-contrib==2.9.0", "gymnasium==1.2.2", "torch==2.14.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartsom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "cp: integration acceptance requiring the optional locked CP environment",
    "gym: optional Gymnasium adapter acceptance",
    "learning: real locked RLlib and SB3 training/checkpoint acceptance",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
