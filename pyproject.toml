[project]
name = "smartsom"
version = "0.1.0"
description = "A modular dynamic flexible job shop simulator scaffold."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.13.4,<3",
    "PyYAML>=6.0.2,<7",
    "rich>=14,<15",
]

[project.scripts]
smartsom = "smartsom.experiments.cli:main"

[project.optional-dependencies]
studio = ["PySide6==6.11.2"]
learning = ["ray[rllib]==2.58.0", "gymnasium==1.2.2", "torch==2.14.0", "pettingzoo==1.27.0", "stable-baselines3==2.9.0", "sb3-contrib==2.9.0"]
tensorboard = ["tensorboard>=2.20,<3"]
wandb = ["wandb>=0.21,<1"]
search = ["optuna>=4.5,<5"]
reports = ["matplotlib>=3.10,<4"]
cpu = ["torch==2.14.0"]
cuda = ["torch==2.14.0"]
cp = ["pyjobshop==0.0.9", "ortools==9.12.4544"]
gym = ["gymnasium==1.2.2"]
pettingzoo = ["pettingzoo==1.27.0", "gymnasium==1.2.2"]
learning-rllib = ["ray[rllib]==2.58.0", "gymnasium==1.2.2", "torch==2.14.0"]
learning-sb3 = ["stable-baselines3==2.9.0", "sb3-contrib==2.9.0", "gymnasium==1.2.2", "torch==2.14.0"]
learning-marl = ["pettingzoo==1.27.0", "ray[rllib]==2.58.0", "gymnasium==1.2.2", "torch==2.14.0"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu130", extra = "cuda", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartsom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "studio: desktop preview acceptance requiring the optional Qt environment",
    "cp: integration acceptance requiring the optional locked CP environment",
    "gym: optional Gymnasium adapter acceptance",
    "pettingzoo: optional resource-agent Parallel API acceptance",
    "learning: real locked RLlib and SB3 training/checkpoint acceptance",
    "marl: real locked two-role PPO training/checkpoint acceptance",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
