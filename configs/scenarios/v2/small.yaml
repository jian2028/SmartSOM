schema: smartsom.scenario/v1
jobs:
  orders:
    total: 300
    initial: 40
  arrivals:
    mean_interval_ticks: 14.4
  routes:
    families:
    - - A
      - B
      - C
      - D
    - - B
      - C
      - D
      - E
    - - C
      - D
      - E
      - F
    - - D
      - E
      - F
      - G
    - - E
      - F
      - G
      - H
    - - F
      - G
      - H
      - A
    - - G
      - H
      - A
      - B
    - - H
      - A
      - B
      - C
    repeat_first_probability: 0.5
  processing:
    base_ticks:
      A: 30.0
      B: 40.0
      C: 50.0
      D: 40.0
      E: 30.0
      F: 40.0
      G: 50.0
      H: 40.0
    relative_variation: 0.2
  due_dates:
    mixture:
    - - 0.2
      - 1.5
      - 2.5
    - - 0.8
      - 2.0
      - 3.0
factory:
  factory_id: v2_small
  name: V2 small
  grid:
    width: 14
    height: 12
    blocked_cells: []
  operation_types:
  - A
  - B
  - C
  - D
  - E
  - F
  - G
  - H
  machines:
    defaults:
      processing_rate_multiplier: '1'
      quality_modes:
      - error_rate: '0.01'
        quality_mode_id: slow
        time_scale: '1.2'
      - error_rate: '0.018'
        quality_mode_id: normal
        time_scale: '1'
      - error_rate: '0.03'
        quality_mode_id: fast
        time_scale: '0.8'
      breakdown:
        enabled: true
        intervals:
          low:
            scale: 600.0
            lower: 60.0
            upper: 1800.0
          medium:
            scale: 300.0
            lower: 30.0
            upper: 900.0
          high:
            scale: 150.0
            lower: 15.0
            upper: 450.0
        repair:
          scale: 60.0
          lower: 10.0
          upper: 180.0
