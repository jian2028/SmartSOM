schema: smartsom.experiment-config/v4
task: train-evaluate
batch:
  stage: 10
  parallel_files: 1
  gate:
    min_cases: 5
    min_deliveries_each: 1
    require_first_pickup: true
matrix:
  factories:
  - ../../factories/batch02_small_h1.yaml
  workloads:
  - ../../workloads/batch02_small_low.yaml
  algorithms:
  - ../../algorithms/central01_ppo.yaml
  seeds: [101, 1101]
data_seed: 909
training:
  total_ticks: 65536
  ticks_per_update: 256
  max_ticks: 4096
  record_initial: true
runtime:
  device: cpu
  num_envs: 1
  sampling_processes: 0
  numerical_threads: 1
  environment:
    tick_limit: 4096
    processing_rounding: ceil
    transport:
      mode: travel_time_matrix
      resolved:
        schema: smartsom.travel-time-matrix/v1
        source: auto
        overrides: {}
execution:
  executor: native
  background: true
  max_concurrent: 2
  tuning: 'off'
  mode: performance
  scheduling: fixed
  calibration_level: 'off'
  preflight: quick
logging:
  wandb: true
  wandb_project: smartsom-central01
  wandb_mode: online
  tensorboard: true
validation:
  enabled: true
  every_updates: 8
  replications: 5
  best_mode: completion_delivery_return
evaluation:
  checkpoint: best
  replications: 5
  record: true
  full_replay: true
checkpointing:
  every_updates: 8
  keep_last: 64
output:
  root: ../../../runs/central-01
  name: central01_long
