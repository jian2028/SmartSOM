schema: smartsom.experiment-config/v4
task: train
matrix:
  factories:
  - ../../../factories/batch02_small_h1.yaml
  workloads:
  - ../../../workloads/batch02_small_low.yaml
  algorithms:
  - ../../../algorithms/central01_split_task_shape.yaml
  seeds: [101]
data_seed: 909
training:
  total_ticks: 4096
  ticks_per_update: 256
  max_ticks: 4096
  record_initial: true
runtime:
  device: cpu
  num_envs: 1
  sampling_processes: 0
  numerical_threads: 1
  environment:
    tick_limit: 4096
    processing_rounding: ceil
    transport:
      mode: grid
execution:
  executor: native
  background: false
  max_concurrent: 1
  tuning: 'off'
  mode: performance
  scheduling: fixed
  calibration_level: 'off'
  preflight: quick
validation:
  enabled: false
evaluation:
  checkpoint: last
  replications: 1
  deterministic: false
  record: true
  full_replay: false
checkpointing:
  every_updates: 64
  keep_last: 10
  keep_continuations: 2
output:
  root: ../../../../runs/central-01
  name: split_shape_probe
