        schema: smartsom.travel-time-matrix/v1
        source: auto
        overrides: {}
execution:
  executor: native
  background: true
  max_concurrent: 2
  tuning: 'off'
  mode: performance
  scheduling: fixed
  calibration_level: 'off'
  preflight: quick
validation:
  enabled: true
  every_updates: 4
  replications: 5
  best_mode: completion_delivery_return
evaluation:
  checkpoint: best
  replications: 5
  record: false
  full_replay: true
checkpointing:
  every_updates: 4
  keep_last: 64
output:
  root: ../../../../runs/base-batch-02-v4-supplement
  name: batch02_joint_shape_seed1101
