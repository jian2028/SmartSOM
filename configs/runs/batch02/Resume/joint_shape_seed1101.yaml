schema: smartsom.experiment-config/v4
task: train-evaluate
batch:
  stage: 20
  parallel_files: 1
factory: ../../../factories/batch02_small_h1.yaml
workload: ../../../workloads/batch02_small_low.yaml
algorithm: ../../../algorithms/batch02_joint_shape.yaml
seed: 1101
data_seed: 909
training:
  total_ticks: 16384
  ticks_per_update: 256
  max_ticks: 4096
  record_initial: true
runtime:
  device: cpu
  num_envs: 1
  sampling_processes: 0
  numerical_threads: 1
  environment:
    tick_limit: 4096
    processing_rounding: ceil
    transport:
      mode: travel_time_matrix
