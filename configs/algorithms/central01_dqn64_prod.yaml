schema: smartsom.algorithm/v2
mode: central
learner:
  backend: rllib
  algorithm: dqn
  gamma: 0.99
  parameters:
    learning_rate: 0.0005
    replay_capacity: 50000
    batch_size: 32
    warmup_ticks: 1000
    target_update_ticks: 500
    epsilon_start: 1.0
    epsilon_end: 0.05
    epsilon_ticks: 30000
  reward:
    team:
      name: builtin.production_potential
      version: '1'
      parameters:
        weight: 1000.0
        empty_weight: 250.0
        gradient: 0.5
        cells: 10
        gamma: 0.99
        progress_weight: 50.0
    learner_scale: 0.001
pickup_matching: global_optimal
controller:
  kind: new_model
  extensions:
    network:
      q:
        hidden_sizes: [64, 64]
        activation: tanh
