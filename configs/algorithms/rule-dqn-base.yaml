schema: smartsom.algorithm-components/v2
action_representation:
  default: rules
  rules:
    dispatcher.pickup:
    - nearest
    - most_ready_stock
    - most_urgent_ready_stock
    - fewest_commitments
    dispatcher.delivery:
    - nearest
    - least_pre_nominal_work
    - fewest_pre_jobs
    pre.accept:
    - job_edd
    - nearest
    - least_remaining_nominal_work
    post.accept:
    - nearest
    - longest_continuous_unassigned_idle
    input.accept:
    - nearest
    - longest_continuous_unassigned_idle
    pre.service:
    - job_edd
    - oldest_recorded_arrival
    - least_remaining_nominal_work
    post.service:
    - job_edd
    - longest_job_queue
    - least_remaining_nominal_work
    - most_remaining_nominal_work
    - most_currently_feasible_next_machines
    - least_next_pre_nominal_work
    input.service:
    - job_edd
    - longest_job_queue
    - least_remaining_nominal_work
    - most_remaining_nominal_work
    - most_currently_feasible_next_machines
    - least_next_pre_nominal_work
    machine.process:
    - job_edd
    - shortest_nominal_processing
    - longest_job_queue
control: base
production:
  default: dqn
  bindings: {}
  policies:
    dqn:
      kind: learning
      learner:
        target: smartsom.learning.dqn.create_learner
        params:
          width: 32
          learning_rate: 0.0003
          epochs: 3
          batch_size: 256
          clip: 0.2
          entropy: 0.01
          replay_capacity: 10000
          target_update_interval: 100
          epsilon: 0.1
          learning_reward_scale: 0.001
          critic_initial_scale: 1.0
          initialization: legacy-rule-dqn-v1
      observation:
        target: smartsom.representations.base.observation.create_observation
        params: {}
      encoder:
        target: smartsom.representations.base.encoder.create_encoder
        params: {}
traffic:
  mover:
    target: smartsom.traffic.rule_mover.create_mover
decision_protocol:
  reevaluate_ticks: 10
  time_scale: 200.0
  distance_scale: 50.0
  count_scale: 20.0
  quality_penalty: 1000.0
  pre:
    accept:
      allow_stop: false
  post:
    accept:
      allow_stop: false
  dispatcher:
    pickup:
      allow_empty_wait: false
