schema: smartsom.algorithm-components/v2
control: centralized
production:
  default: ppo
  policies:
    ppo:
      kind: learning
      observation:
        target: smartsom.controllers.e1a.observation.create_observation
      network:
        target: smartsom.controllers.e1a.network.create_network
        params:
          advance_only_when_idle: true
      critic_observation:
        target: smartsom.controllers.e1a.observation.create_critic_observation
      learner:
        target: smartsom.learning.rllib_config.ppo_config
        params:
          lr: 0.0001
          gamma: 1.0
          num_epochs: 4
          minibatch_size: 100
          lambda_: 0.95
          clip_param: 0.2
          entropy_coeff: 0.03
reward:
  target: smartsom.controllers.e1a.reward.create_current_reward
  params:
    scale: 0.001
action_representation:
  default: direct
traffic:
  mover:
    target: smartsom.traffic.rule_mover.create_mover
central:
  wip_limit: 96
