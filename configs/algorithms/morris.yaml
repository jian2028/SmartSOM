# 方法：决策机制及策略选择
schema: smartsom.algorithm-components/v2
control: base  # base = 角色决策机制；centralized = 集中式直接派单

# 策略组件：观测 → 编码/网络 → learner（或 Rule 实现）
production:
  default: morris_central_ppo
  bindings: {}
  policies:
    morris_central_ppo:
      kind: learning

      # Actor/Q 输入：选择信息和统计方式；target 是 Python 工厂路径
      observation:
        target: smartsom.controllers.morris.observation.create_observation
        params:
          time_scale: 200.0
          count_scale: 20.0

      # 完整网络组件；隐藏层等参数由该组件支持的 params 决定
      network:
        target: smartsom.controllers.morris.network.create_network

      # 仅需要价值函数的 learner 使用；Double DQN 不构造 critic 观测
      critic_observation:
        target: smartsom.observations.critic.create_observation

      # 学习超参数；epochs 在 PPO 与 DDQN 中含义不同
      learner:
        target: smartsom.controllers.morris.create_learner
        params:
          learning_rate: 0.0003  # 优化器学习率
          learning_reward_scale: 0.001  # learner 内的奖励缩放，叠加在 reward 组件结果之后
          epochs: 3  # 每次更新遍历当前 rollout 的轮数
          batch_size: 256  # 每次梯度更新的决策样本数，不是 episode 数
          clip: 0.2
          entropy: 0.01

# 学习奖励：与物理交付/迟交指标分开记录
reward:
  target: smartsom.rewards.default.create_reward

# 动作：direct 直接候选；rules 将规则映射到合法候选，列表顺序保留
action_representation:
  default: rules
  rules:
    dispatcher.pickup: [nearest, most_ready_stock, most_urgent_ready_stock, fewest_commitments]
    dispatcher.delivery: [nearest, least_pre_nominal_work, fewest_pre_jobs]
    pre.accept: [job_edd, nearest, least_remaining_nominal_work]
    post.accept: [nearest, longest_continuous_unassigned_idle]
    input.accept: [nearest, longest_continuous_unassigned_idle]
    pre.service: [job_edd, oldest_recorded_arrival, least_remaining_nominal_work]
    post.service:
      - job_edd
      - longest_job_queue
      - least_remaining_nominal_work
      - most_remaining_nominal_work
      - most_currently_feasible_next_machines
      - least_next_pre_nominal_work
    input.service:
      - job_edd
      - longest_job_queue
      - least_remaining_nominal_work
      - most_remaining_nominal_work
      - most_currently_feasible_next_machines
      - least_next_pre_nominal_work
    machine.process: [job_edd, shortest_nominal_processing, longest_job_queue]

# 决策协议：动作权限与公共尺度
decision_protocol:
  reevaluate_ticks: 10  # 单位：物理 tick
  time_scale: 200.0
  distance_scale: 50.0
  count_scale: 20.0
  quality_penalty: 1000.0
  pre:
    accept:
      allow_stop: false  # 是否提供 STOP 候选（影响动作空间）
  post:
    accept:
      allow_stop: false  # 是否提供 STOP 候选（影响动作空间）
  dispatcher:
    pickup:
      allow_empty_wait: false  # 是否提供 EMPTY_WAIT 候选（影响动作空间）

# 交通：共用 AGV mover
traffic:
  mover:
    target: smartsom.traffic.rule_mover.create_mover
