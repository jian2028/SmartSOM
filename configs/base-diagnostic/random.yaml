schema: smartsom.algorithm-components/v1
control: base
production:
  default: random
  bindings: {}
  policies:
    random:
      kind: policy
      implementation:
        target: smartsom.policies.random.create_policy
traffic:
  mover:
    target: smartsom.traffic.rule_mover.create_mover
decision_protocol:
  reevaluate_ticks: 10
  time_scale: 200.0
  distance_scale: 50.0
  count_scale: 20.0
  quality_penalty: 1000.0
  pre:
    accept:
      allow_stop: true
  post:
    accept:
      allow_stop: true
  dispatcher:
    pickup:
      allow_empty_wait: false
