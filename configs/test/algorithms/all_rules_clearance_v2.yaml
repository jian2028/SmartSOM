schema: smartsom.algorithm/v2
mode: rules
pickup_matching: priority_greedy
agents:
  machine:
    default: {kind: rule, name: normal_first}
  buffer:
    default: {kind: rule, name: edd}
  dispatcher:
    default:
      kind: rule
      name: nearest
      parameters:
        fleet_admission: traffic
        work_in_progress_first: true
  mover:
    default: {kind: rule, name: clearance_shortest_path}
