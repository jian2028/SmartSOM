name: Portable foreground control

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.12.22"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --no-sync pytest -q tests/unit/test_portable_control.py tests/unit/test_portable_paths.py tests/unit/test_run_control.py tests/unit/test_runtime_display.py tests/unit/test_workflow_dashboard.py

  windows-learning:
    runs-on: windows-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONUTF8: "1"
      RAY_ENABLE_UV_RUN_RUNTIME_ENV: "0"
      SMARTSOM_REQUIRE_LEARNING: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.12.22"
          python-version: "3.12"
      - run: uv sync --locked --extra learning --extra cpu --extra tuning
      - name: Verify native recovery and display equivalence
        run: |
          uv run --no-sync python -c "import torch, ray.rllib, sb3_contrib, psutil, threadpoolctl"
          uv run --no-sync pytest -q tests/unit/test_composable_learning.py tests/integration/test_author_learning.py tests/integration/test_runtime_display_integration.py -k "not fresh_optuna" --basetemp="\\?\${{ runner.temp }}\smartsom-native"

  diagnostics:
    name: Native diagnostics and provenance (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONUTF8: "1"
      RAY_ENABLE_UV_RUN_RUNTIME_ENV: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.12.22"
          python-version: "3.12"
      - run: uv sync --locked --extra learning --extra cpu --extra tuning
      - run: uv run --no-sync python -c "import torch, ray.rllib, sb3_contrib"
      - run: uv run --no-sync pytest -q tests/unit/test_diagnostics_config.py tests/unit/test_extended_diagnostics.py tests/unit/test_v3_diagnostic_contracts.py tests/unit/test_production_diagnostics.py tests/unit/test_physical_job_observation.py --junitxml=diagnostics.xml
      - run: uv run --no-sync python -c "import xml.etree.ElementTree as E; r=E.parse('diagnostics.xml'); assert sum(int(s.get('skipped',0)) for s in r.iter('testsuite')) == 0"
