name: Claude review

# Comment "@claude ..." on a pull request to ask Claude for a review.
# Only the repository owner can trigger it, and Claude cannot edit or push code.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.login == 'jian2028' &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          claude_args: |
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*)"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
            --append-system-prompt "You are reviewing a SmartSOM pull request. Review only; never edit files, commit or push. Read AGENTS.md and .agents/skills/code-review/SKILL.md first and apply their standards, including the research-semantics checks (reward, observation, metrics, termination, comparison fairness, defaults that change existing experiments, checkpoint and config compatibility). Report only confirmed problems with location, trigger and consequence; zero findings is acceptable. Use inline comments for specific lines and one summary comment. Reply in the language of the triggering comment."
