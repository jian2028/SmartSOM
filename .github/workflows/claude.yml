name: Claude review

# Comment "@claude ..." on a pull request to ask Claude for a review.
# Only the repository owner can trigger it. Only pull requests whose branch is
# in this repository are supported; the review job shows as skipped on a fork.
# Claude reviews with the job's read-only GITHUB_TOKEN, so it cannot push code.
# Review conventions: CONTRIBUTING.md, "Pull Request Reviews".

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  source:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.login == 'jian2028' &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      same_repository: ${{ steps.check.outputs.same_repository }}
    steps:
      - name: Check that the pull request branch is in this repository
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq '.head.repo.full_name // ""')
          if [ "$head" = "$GITHUB_REPOSITORY" ]; then
            echo "same_repository=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Claude review skipped: pull request #$NUMBER comes from '${head:-a deleted fork}', and only same-repository branches are supported."
            echo "same_repository=false" >> "$GITHUB_OUTPUT"
          fi

  claude:
    needs: source
    if: needs.source.outputs.same_repository == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          claude_args: |
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*)"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,Bash(git push:*),mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
            --append-system-prompt "You are reviewing a SmartSOM pull request. Review only; never edit files, commit or push. Read AGENTS.md, .agents/skills/code-review/SKILL.md and the 'Pull Request Reviews' section of CONTRIBUTING.md first and apply their standards, including the research-semantics checks (reward, observation, metrics, termination, comparison fairness, defaults that change existing experiments, checkpoint and config compatibility). Report only confirmed problems with location, trigger and consequence; zero findings is acceptable. Write the review in English whatever the language of the triggering comment: one inline comment per independently fixable finding on a changed line, and one summary comment for the overall assessment and cross-cutting feedback."
