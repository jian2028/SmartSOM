name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.12 quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked project environment
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

  gym:
    name: Python 3.12 Gym interface acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra gym
      - name: Require actual Gym acceptance
        env:
          SMARTSOM_REQUIRE_GYM: "1"
        run: uv run --no-sync pytest -q tests/unit/test_learning_projection.py tests/unit/test_learning_gymnasium.py

  resource-protocol:
    name: Python 3.12 grid resource protocol acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra cpu --extra learning-marl
      - name: Require actual sparse RLlib protocol acceptance
        env:
          SMARTSOM_REQUIRE_RESOURCE_PROTOCOL: "1"
        run: uv run --no-sync pytest -q tests/unit/test_resource_projection.py tests/unit/test_resource_protocol.py

  learning:
    name: Python 3.12 fixed learning acceptance
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      RAY_ENABLE_UV_RUN_RUNTIME_ENV: "0"
      SMARTSOM_REQUIRE_LEARNING: "1"
      SMARTSOM_REQUIRE_GYM: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra cpu --extra gym --extra learning-rllib --extra learning-sb3 --extra learning-marl --extra tuning --extra tensorboard
      - run: uv run --no-sync pytest -q --durations=20 --basetemp="${{ runner.temp }}/learning-pytest"
      - name: Collect regular learning diagnostic files
        if: failure()
        run: |
          mkdir -p "${{ runner.temp }}/learning-diagnostics"
          if [ -d "${{ runner.temp }}/learning-pytest" ]; then
            cd "${{ runner.temp }}/learning-pytest"
            find . -type f \( -name 'evaluation-*.log' -o -name 'study-process.log' -o -name 'report.json' -o -name 'summary.json' \) \
              -exec cp --parents -- {} "${{ runner.temp }}/learning-diagnostics/" \;
          fi
      - name: Preserve failed learning diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: learning-failure-${{ github.run_attempt }}
          path: ${{ runner.temp }}/learning-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  tuning:
    name: Python 3.12 native Ray Tune execution
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      RAY_ENABLE_UV_RUN_RUNTIME_ENV: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra learning --extra tuning --extra cpu --extra tensorboard
      - name: Require optional runtime before acceptance
        run: |
          uv run --no-sync python -c 'import ray, torch, psutil, threadpoolctl; assert ray.__version__ == "2.58.0"'
      - name: Verify calibration, continuation, resource changes and batch execution
        run: |
          uv run --no-sync pytest -q tests/unit/test_tuning_*.py tests/integration/test_tuning_*.py --basetemp="${{ runner.temp }}/tuning-pytest" --junitxml="${{ runner.temp }}/tuning-pytest.xml"
      - name: Stage bounded online lifecycle evidence
        id: stage_online_lifecycle
        if: always()
        env:
          EVIDENCE_SOURCE: ${{ runner.temp }}/tuning-pytest
          EVIDENCE_STAGE: ${{ runner.temp }}/online-lifecycle-evidence
        run: |
          python - <<'PYTHON'
          import json
          import os
          import stat
          from pathlib import Path

          source = Path(os.environ["EVIDENCE_SOURCE"])
          stage = Path(os.environ["EVIDENCE_STAGE"])
          stage.mkdir(exist_ok=False)
          if source.exists():
              assert not source.is_symlink() and source.is_dir()
              names = (
                  "online-real-clock-report.json",
                  "online-controlled-clock-report.json",
              )
              for name in names:
                  paths = list(source.rglob(name))
                  assert len(paths) <= 1, f"duplicate lifecycle report: {name}"
                  for path in paths:
                      relative = path.relative_to(source)
                      for part in (path, *path.parents):
                          assert not part.is_symlink(), f"symlink evidence: {part}"
                          if part == source:
                              break
                      assert stat.S_ISREG(path.stat().st_mode), relative
                      assert path.stat().st_size <= 256 * 1024, relative
                      report = json.loads(path.read_text(encoding="utf-8"))
                      # Copy only the bounded JSON, never checkpoint/replay trees.
                      payload = (json.dumps(report) + "\n").encode("utf-8")
                      assert len(payload) <= 256 * 1024, relative
                      (stage / name).write_bytes(payload)
                      print(f"Preserved {name}: {len(payload)} bytes")
          PYTHON
      - name: Preserve online lifecycle evidence
        if: always() && steps.stage_online_lifecycle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: online-lifecycle-${{ github.run_attempt }}
          path: ${{ runner.temp }}/online-lifecycle-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve failed execution diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tuning-failure-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tuning-pytest.xml
            ${{ runner.temp }}/tuning-pytest/**/calibration.json
            ${{ runner.temp }}/tuning-pytest/**/batch.json
            ${{ runner.temp }}/tuning-pytest/**/probe.log
          if-no-files-found: ignore
          retention-days: 7

  cp:
    name: Python 3.12 CP acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked CP environment
        run: uv sync --locked --extra cp
      - name: Require real CP acceptance
        env:
          SMARTSOM_REQUIRE_CP: "1"
        run: uv run --no-sync pytest -q

  resource-learning:
    name: Python 3.12 fixed resource PPO acceptance
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      RAY_ENABLE_UV_RUN_RUNTIME_ENV: "0"
      SMARTSOM_REQUIRE_MARL: "1"
      SMARTSOM_REQUIRE_RESOURCE_PROTOCOL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra cpu --extra learning-marl
      - run: uv run --no-sync pytest -q tests/unit/test_resource_projection.py tests/unit/test_resource_protocol.py tests/unit/test_resource_training.py tests/unit/test_resource_optimization.py tests/unit/test_resource_lifecycle.py tests/unit/test_resource_acceptance.py tests/integration/test_resource_backend.py

  usability:
    name: Python 3.12 experiment lifecycle and local reporting
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      RAY_ENABLE_UV_RUN_RUNTIME_ENV: "0"
      SMARTSOM_REQUIRE_LEARNING: "1"
      SMARTSOM_REQUIRE_MARL: "1"
      SMARTSOM_REQUIRE_TRACKING: "1"
      SMARTSOM_REQUIRE_REPORTS: "1"
      SMARTSOM_REQUIRE_SEARCH: "1"
      SMARTSOM_REQUIRE_EXTENSIONS: "1"
      WANDB_MODE: "offline"
      MPLBACKEND: "Agg"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra learning --extra cpu --extra tensorboard --extra wandb --extra reports --extra search
      - run: uv run --no-sync pytest -q tests/unit/test_experiment_config.py tests/unit/test_validation_cases.py tests/unit/test_doctor.py tests/unit/test_usability_acceptance.py tests/unit/test_learning_cli.py tests/unit/test_training_display.py tests/unit/test_report.py tests/unit/test_report_evaluation.py tests/unit/test_packaging.py tests/unit/test_catalog.py tests/unit/test_evaluation.py tests/unit/test_training_controls.py tests/unit/test_learning_study.py tests/unit/test_optuna_search.py tests/unit/test_extensions.py tests/unit/test_extension_examples.py tests/integration/test_training_lifecycle.py tests/integration/test_training_sampling.py tests/integration/test_training_extensions.py tests/integration/test_training_reward_isolation.py tests/integration/test_training_probe.py tests/integration/test_experiment_api.py tests/integration/test_learning_study_integration.py
