name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONUTF8: "1"
  RAY_ENABLE_UV_RUN_RUNTIME_ENV: "0"
  WANDB_MODE: "offline"
  MPLBACKEND: "Agg"
  QT_QPA_PLATFORM: "offscreen"

jobs:
  plan:
    name: Classify change and validate ownership
    outputs:
      studio: ${{ steps.selection.outputs.studio }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.22"
          python-version: "3.12"
          enable-cache: true
      - name: Select affected suites, fail closed on uncertain impact
        id: selection
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: uv run --no-project python scripts/ci/selection.py --event "$EVENT" --base "$BASE_SHA" --head "$HEAD_SHA" --output ci-plan.json
      - name: Preserve auditable selection plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-plan
          overwrite: true
          path: ci-plan.json
          if-no-files-found: error
          retention-days: 7

  fast:
    name: Python 3.12 fast contracts
    needs: plan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.22"
          python-version: "3.12"
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: .
      - name: Execute selected ownership slice or record not required
        run: uv run --no-project python scripts/ci/runner.py --suite fast --platform ubuntu-latest --plan ci-plan.json --sync
      - name: Preserve selection counts and JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-result-fast-ubuntu-latest
          overwrite: true
          path: ci-results/
          if-no-files-found: error
          retention-days: 7

  gym:
    name: Python 3.12 Gym interface acceptance
    needs: plan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.22"
          python-version: "3.12"
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: .
      - name: Execute selected ownership slice or record not required
        run: uv run --no-project python scripts/ci/runner.py --suite gym --platform ubuntu-latest --plan ci-plan.json --sync
      - name: Preserve selection counts and JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-result-gym-ubuntu-latest
          overwrite: true
          path: ci-results/
          if-no-files-found: error
          retention-days: 7

  learning:
    name: Python 3.12 fixed learning acceptance
    needs: plan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.22"
          python-version: "3.12"
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: .
      - name: Execute selected ownership slice or record not required
        run: uv run --no-project python scripts/ci/runner.py --suite learning --platform ubuntu-latest --plan ci-plan.json --sync
      - name: Preserve selection counts and JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-result-learning-ubuntu-latest
          overwrite: true
          path: ci-results/
          if-no-files-found: error
          retention-days: 7
      - name: Collect regular learning diagnostic files
        if: failure()
        run: |
          mkdir -p "${{ runner.temp }}/learning-diagnostics"
          if [ -d "${{ runner.temp }}/ci-tests/learning" ]; then
            cd "${{ runner.temp }}/ci-tests/learning"
            find . -type f \( -name 'evaluation-*.log' -o -name 'study-process.log' -o -name 'report.json' -o -name 'summary.json' \) \
              -exec cp --parents -- {} "${{ runner.temp }}/learning-diagnostics/" \;
          fi
      - name: Preserve failed learning diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: learning-failure-${{ github.run_attempt }}
          path: ${{ runner.temp }}/learning-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  tuning:
    name: Python 3.12 native Ray Tune execution
    needs: plan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.22"
          python-version: "3.12"
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: .
      - name: Execute selected ownership slice or record not required
        run: uv run --no-project python scripts/ci/runner.py --suite tuning --platform ubuntu-latest --plan ci-plan.json --sync
      - name: Preserve selection counts and JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-result-tuning-ubuntu-latest
          overwrite: true
          path: ci-results/
          if-no-files-found: error
          retention-days: 7
      - name: Stage bounded online lifecycle evidence
        id: stage_online_lifecycle
        if: always()
        env:
          EVIDENCE_SOURCE: ${{ runner.temp }}/ci-tests/tuning
          EVIDENCE_STAGE: ${{ runner.temp }}/online-lifecycle-evidence
        run: |
          python - <<'PYTHON'
          import json
          import os
          import stat
          from pathlib import Path

          source = Path(os.environ["EVIDENCE_SOURCE"])
          stage = Path(os.environ["EVIDENCE_STAGE"])
          stage.mkdir(exist_ok=False)
          if source.exists():
              assert not source.is_symlink() and source.is_dir()
              names = (
                  "online-real-clock-report.json",
                  "online-controlled-clock-report.json",
              )
              for name in names:
                  paths = list(source.rglob(name))
                  assert len(paths) <= 1, f"duplicate lifecycle report: {name}"
                  for path in paths:
                      relative = path.relative_to(source)
                      for part in (path, *path.parents):
                          assert not part.is_symlink(), f"symlink evidence: {part}"
                          if part == source:
                              break
                      assert stat.S_ISREG(path.stat().st_mode), relative
                      assert path.stat().st_size <= 256 * 1024, relative
                      report = json.loads(path.read_text(encoding="utf-8"))
                      # Copy only the bounded JSON, never checkpoint/replay trees.
                      payload = (json.dumps(report) + "\n").encode("utf-8")
                      assert len(payload) <= 256 * 1024, relative
                      (stage / name).write_bytes(payload)
                      print(f"Preserved {name}: {len(payload)} bytes")
          PYTHON
      - name: Preserve online lifecycle evidence
        if: always() && steps.stage_online_lifecycle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: online-lifecycle-${{ github.run_attempt }}
          path: ${{ runner.temp }}/online-lifecycle-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve failed execution diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tuning-failure-${{ github.run_attempt }}
          path: |
            ci-results/tuning-ubuntu-latest.xml
            ${{ runner.temp }}/ci-tests/tuning/**/calibration.json
            ${{ runner.temp }}/ci-tests/tuning/**/batch.json
            ${{ runner.temp }}/ci-tests/tuning/**/probe.log
          if-no-files-found: ignore
          retention-days: 7

  resource-learning:
    name: Python 3.12 fixed resource PPO acceptance
    needs: plan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.22"
          python-version: "3.12"
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: .
      - name: Execute selected ownership slice or record not required
        run: uv run --no-project python scripts/ci/runner.py --suite resource-learning --platform ubuntu-latest --plan ci-plan.json --sync
      - name: Preserve selection counts and JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-result-resource-learning-ubuntu-latest
          overwrite: true
          path: ci-results/
          if-no-files-found: error
          retention-days: 7

  usability:
    name: Python 3.12 experiment lifecycle and local reporting
    needs: plan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.22"
          python-version: "3.12"
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: .
      - name: Execute selected ownership slice or record not required
        run: uv run --no-project python scripts/ci/runner.py --suite usability --platform ubuntu-latest --plan ci-plan.json --sync
      - name: Preserve selection counts and JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-result-usability-ubuntu-latest
          overwrite: true
          path: ci-results/
          if-no-files-found: error
          retention-days: 7

  studio:
    name: Python 3.12 offscreen Studio acceptance
    needs: plan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.22"
          python-version: "3.12"
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: .
      - name: Install Qt offscreen system libraries
        if: needs.plan.outputs.studio == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libopengl0 libxkbcommon0
      - name: Execute selected ownership slice or record not required
        run: uv run --no-project python scripts/ci/runner.py --suite studio --platform ubuntu-latest --plan ci-plan.json --sync
      - name: Preserve selection counts and JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-result-studio-ubuntu-latest
          overwrite: true
          path: ci-results/
          if-no-files-found: error
          retention-days: 7

  control:
    name: control (${{ matrix.os }})
    needs: plan
    if: always()
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.22"
          python-version: "3.12"
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: .
      - name: Execute selected ownership slice or record not required
        run: uv run --no-project python scripts/ci/runner.py --suite control --platform ${{ matrix.os }} --plan ci-plan.json --sync
      - name: Preserve selection counts and JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-result-control-${{ matrix.os }}
          overwrite: true
          path: ci-results/
          if-no-files-found: error
          retention-days: 7

  windows-learning:
    needs: plan
    if: always()
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.22"
          python-version: "3.12"
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: .
      - name: Execute selected ownership slice or record not required
        run: uv run --no-project python scripts/ci/runner.py --suite windows-learning --platform windows-latest --plan ci-plan.json --sync
      - name: Preserve selection counts and JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-result-windows-learning-windows-latest
          overwrite: true
          path: ci-results/
          if-no-files-found: error
          retention-days: 7

  diagnostics:
    name: Native diagnostics and provenance (${{ matrix.os }})
    needs: plan
    if: always()
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.22"
          python-version: "3.12"
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: .
      - name: Execute selected ownership slice or record not required
        run: uv run --no-project python scripts/ci/runner.py --suite diagnostics --platform ${{ matrix.os }} --plan ci-plan.json --sync
      - name: Preserve selection counts and JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-result-diagnostics-${{ matrix.os }}
          overwrite: true
          path: ci-results/
          if-no-files-found: error
          retention-days: 7

  macos-learning:
    name: macOS native checkpoint and process acceptance
    needs: plan
    if: always()
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.22"
          python-version: "3.12"
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: .
      - name: Execute selected ownership slice or record not required
        run: uv run --no-project python scripts/ci/runner.py --suite macos-learning --platform macos-latest --plan ci-plan.json --sync
      - name: Preserve selection counts and JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-result-macos-learning-macos-latest
          overwrite: true
          path: ci-results/
          if-no-files-found: error
          retention-days: 7

  cp:
    name: Python 3.12 CP acceptance
    needs: fast
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify compatibility owner completed
        env:
          OWNER_RESULT: ${{ needs.fast.result }}
        run: |
          echo "Unsupported grid CP rejection is owned by fast; this is not native solver acceptance."
          test "$OWNER_RESULT" = success

  resource-protocol:
    name: Python 3.12 grid resource protocol acceptance
    needs: resource-learning
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify compatibility owner completed
        env:
          OWNER_RESULT: ${{ needs.resource-learning.result }}
        run: |
          echo "Sparse protocol contracts are owned by resource-learning; execute once."
          test "$OWNER_RESULT" = success

  quality:
    name: Python 3.12 quality gate
    needs: [plan, fast, gym, resource-protocol, learning, tuning, cp, resource-learning, usability, studio, control, windows-learning, diagnostics, macos-learning]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.22"
          python-version: "3.12"
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-result-*
          path: ci-results
          merge-multiple: true
      - name: Require every planned suite and successful prerequisite
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: uv run --no-project python scripts/ci/selection.py gate --plan ci-plan.json --results ci-results --needs-json "$NEEDS_JSON"
