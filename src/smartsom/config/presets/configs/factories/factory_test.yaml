schema: smartsom.factory/v2
factory:
  factory_id: factory_test
  name: Quickstart factory
  grid:
    width: 8
    height: 3
  operation_types:
  - operation_1
  - operation_2
  - operation_3
  machines:
  - machine_id: M1
    name: M1
    footprint:
      x: 2
      y: 2
      width: 1
      height: 1
    operation_types:
    - operation_1
    - operation_3
  - machine_id: M2
    name: M2
    footprint:
      x: 5
      y: 2
      width: 1
      height: 1
    operation_types:
    - operation_2
    - operation_3
  buffers:
  - buffer_id: input
    name: input
    footprint:
      x: 0
      y: 2
      width: 1
      height: 1
    role: system_input
    storage:
      mode: pool
      capacity: null
  - buffer_id: M1_pre
    name: M1_pre
    footprint:
      x: 1
      y: 2
      width: 1
      height: 1
    role: machine_pre
    storage:
      mode: pool
      capacity: 8
    machine_id: M1
  - buffer_id: M1_post
    name: M1_post
    footprint:
      x: 3
      y: 2
      width: 1
      height: 1
    role: machine_post
    storage:
      mode: pool
      capacity: 8
    machine_id: M1
  - buffer_id: M2_pre
    name: M2_pre
    footprint:
      x: 4
      y: 2
      width: 1
      height: 1
    role: machine_pre
    storage:
      mode: pool
      capacity: 8
    machine_id: M2
  - buffer_id: M2_post
    name: M2_post
    footprint:
      x: 6
      y: 2
      width: 1
      height: 1
    role: machine_post
    storage:
      mode: pool
      capacity: 8
    machine_id: M2
  - buffer_id: output
    name: output
    footprint:
      x: 7
      y: 2
      width: 1
      height: 1
    role: system_output
    storage:
      mode: pool
      capacity: null
  inspection_stations: []
  scrap_bins: []
  ports:
  - port_id: port_input
    name: input
    cell:
      x: 0
      y: 1
    bindings:
    - target:
        kind: buffer
        buffer_id: input
      operations:
      - pickup
  - port_id: port_M1_pre
    name: M1_pre
    cell:
      x: 1
      y: 1
    bindings:
    - target:
        kind: buffer
        buffer_id: M1_pre
      operations:
      - pickup
      - drop_off
  - port_id: port_M1_post
    name: M1_post
    cell:
      x: 3
      y: 1
    bindings:
    - target:
        kind: buffer
        buffer_id: M1_post
      operations:
      - pickup
      - drop_off
  - port_id: port_M1
    name: M1
    cell:
      x: 2
      y: 1
    bindings:
    - target:
        kind: machine
        machine_id: M1
      operations:
      - pickup
      - drop_off
  - port_id: port_M2_pre
    name: M2_pre
    cell:
      x: 4
      y: 1
    bindings:
    - target:
        kind: buffer
        buffer_id: M2_pre
      operations:
      - pickup
      - drop_off
  - port_id: port_M2_post
    name: M2_post
    cell:
      x: 6
      y: 1
    bindings:
    - target:
        kind: buffer
        buffer_id: M2_post
      operations:
      - pickup
      - drop_off
  - port_id: port_M2
    name: M2
    cell:
      x: 5
      y: 1
    bindings:
    - target:
        kind: machine
        machine_id: M2
      operations:
      - pickup
      - drop_off
  - port_id: port_output
    name: output
    cell:
      x: 7
      y: 1
    bindings:
    - target:
        kind: buffer
        buffer_id: output
      operations:
      - drop_off
  agvs:
  - agv_id: agv
    name: agv
    initial_cell:
      x: 0
      y: 0
    initial_heading: east
    job_capacity: 1
    move_cells_per_tick: 1
authoring:
  operation_catalog_mode: manual
