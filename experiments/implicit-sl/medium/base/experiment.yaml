# medium / base
# 修改后运行 smartsom check；仅检查，不会启动实验。
# 入口：相对路径以本文件所在目录为起点
schema: smartsom.base-experiment/v1
scenario: ../../../../configs/scenarios/machine-breakdown/medium-320.yaml
algorithm: ../../../../configs/algorithms/base-ddqn-rules.yaml

# 常改：训练种子与预算（Rule/evaluate 不需要训练预算）
train_seeds: [101, 102, 103]  # 训练/模型种子；固定测试使用文末另一组 seed
train_episodes: &training_episodes 1000  # 每个种子；& 定义本文件内共享数值
budget_boundary: complete_episode
checkpoint_every_episodes: 50  # 单位：完整 episode

# 训练环境：四档混训；不是每档各训练一个模型
training_conditions: [normal, low, medium, high]
condition_sampling: balanced_cycle  # balanced_cycle 按 training_conditions 顺序循环

# 评估：checkpoint 节点、动作选择和验证安排
final_evaluation: true
evaluation:
  mode: limited
  checkpoints:
    - episode: *training_episodes  # 跟随文件顶部预算；CLI --set 不会动态重算别名
      modes: [argmax]
  case_seconds: {}
validation:
  unit: episodes
  milestones: []
  modes: [argmax]
  sample_action_seeds: 1
  selection: last
  select_initial: false

# 执行：任务、并发和监控
run:
  task: train
  seconds: null  # 墙钟秒；null 不设该上限
  methods: [configured]
  selection: argmax
  split: test
  action_seeds: 1  # 自动生成面板的动作种子数量；固定清单使用每条的显式值
  tune: 'off'
  max_failures: 0
batch:
  stage: 0  # 调度阶段，值较小的先进入调度
  parallel_files: 2  # 同 stage 必须一致的批次配置；当前全局并发以 concurrency 为准
concurrency:
  mode: manual
  max_concurrent: 2  # 同时运行的任务上限
tracking:
  mode: online  # W&B 联网；可改 offline / disabled
  project: SmartSOM
resources:
  guard:
    max_worker_rss_gib: 8
    min_host_available_gib: 8
    min_disk_free_gib: 2

# 高级：物理时间边界与训练世界种子派生
drain_ticks: 2000  # 单位：tick；最后一个订单到达后允许的额外时间
drain_frozen: true  # true 使用已确定的 drain；false 的训练/评估需校准配置
train_ticks: 100000  # 单位：物理 tick；train_episodes 非空时由 episode 预算优先
training_world_domain: social-long-v1/world
training_world_prefix: [train]
training_seed_modulus: null  # null 保留完整派生种子，改变会更换训练世界序列

# 固定测试清单：日常调训练参数无需修改；不要手改 hash 绕过世界校验
test:
  conditions: [normal, low, medium, high]
  cases_per_condition: 10  # 必须与下方每档条目数一致；不是总测试数
  # seed = 环境随机种子；action_seeds = 策略采样随机种子
  # 同规模各方法保留完全相同清单；更换场景需重新核验世界 hash
