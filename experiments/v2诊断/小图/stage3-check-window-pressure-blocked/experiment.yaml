schema: smartsom.base-experiment/v1
scenario: ../../../../configs/scenarios/v2/small.yaml
algorithm: ../window-pressure-blocked-algorithm.yaml
train_seeds:
- 101
train_episodes: 8
budget_boundary: complete_episode
checkpoint_every_episodes: 8
training_conditions:
- normal
- low
- medium
- high
condition_sampling: balanced_cycle
final_evaluation: false
evaluation:
  mode: limited
  checkpoints: []
  case_seconds: {}
validation:
  unit: episodes
  milestones: []
  modes:
  - argmax
  sample_action_seeds: 1
  selection: last
  select_initial: false
run:
  task: train
  seconds: null
  methods:
  - configured
  selection: argmax
  split: test
  action_seeds: 1
  tune: 'off'
  max_failures: 0
batch:
  stage: 3
  parallel_files: 2
concurrency:
  mode: manual
  max_concurrent: 2
  evaluation_processes: 1
tracking:
  mode: disabled
  project: SmartSOM
  group: "v2\u8BCA\u65AD-stage3-check"
resources:
  guard:
    max_worker_rss_gib: 12
    min_host_available_gib: 8
    min_disk_free_gib: 2
drain_ticks: 10000
drain_frozen: true
train_ticks: 100000
training_world_domain: social-long-v1/world
training_world_prefix:
- train
training_seed_modulus: null
continuation_keep_generations: 2
case_sets:
  validation: ../panels/validation.json
  test: ../panels/test.json
validation_cases: 32
test_cases: 80
