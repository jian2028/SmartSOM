      - {error_rate: '0.03', quality_mode_id: fast, time_scale: '0.8'}
      breakdown:
        enabled: true
        intervals:
          low: {scale: 600.0, lower: 60.0, upper: 1800.0}
          medium: {scale: 300.0, lower: 30.0, upper: 900.0}
          high: {scale: 150.0, lower: 15.0, upper: 450.0}
