schema: smartsom.base-experiment/v1
scenario: ../../../../configs/scenarios/v2/medium.yaml
algorithm: ../original-pressure-hpof-algorithm.yaml
train_seeds:
- 101
train_episodes: 1000
budget_boundary: complete_episode
checkpoint_every_episodes: 1000
training_conditions:
- normal
- low
- medium
- high
condition_sampling: balanced_cycle
final_evaluation: false
evaluation:
  mode: limited
  checkpoints: []
  case_seconds: {}
run:
  task: train
  seconds: null
  methods:
  - configured
  selection: argmax
  split: test
  action_seeds: 1
  tune: 'off'
  max_failures: 0
batch:
  stage: 3
  parallel_files: 2
concurrency:
  mode: manual
  max_concurrent: 2
  evaluation_processes: 1
tracking:
  mode: disabled
  project: SmartSOM
  group: v2诊断-stage3-long-medium
resources:
  guard:
    max_worker_rss_gib: 12
    min_host_available_gib: 8
    min_disk_free_gib: 2
drain_ticks: 10000
drain_frozen: true
train_ticks: 100000
training_world_domain: social-long-v1/world
training_world_prefix:
- train
training_seed_modulus: null
case_sets:
  test: ../panels/test.json
  periodic_evaluation: ../panels/validation.json
test_cases: 80
periodic_evaluation:
  unit: episodes
  milestones:
  - 250
  - 500
  - 1000
  modes:
  - argmax
  sample_action_seeds: 1
  selection: argmax_complete_cost
  select_initial: false
periodic_evaluation_cases: 32
checkpoint_retention: best_last

# 单任务采样；保持原来的单环境训练行为
sampling:
  num_envs: 1
  processes: 0
  fragment_ticks: 256  # 仅开启片段更新时使用
