schema: smartsom.base-experiment/v1
scenario: ../../../../configs/scenarios/v2/small.yaml
algorithm: ../window-blocked-algorithm.yaml
train_seeds:
- 101
train_episodes: 8
budget_boundary: complete_episode
checkpoint_every_episodes: 8
training_conditions:
- normal
- low
- medium
- high
condition_sampling: balanced_cycle
final_evaluation: false
evaluation:
  mode: limited
  checkpoints: []
  case_seconds: {}
run:
  task: train
  seconds: null
