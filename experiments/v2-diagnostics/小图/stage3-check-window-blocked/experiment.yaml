  - configured
  selection: argmax
  split: test
  action_seeds: 1
  tune: 'off'
  max_failures: 0
batch:
  stage: 3
  parallel_files: 2
concurrency:
  mode: manual
  max_concurrent: 2
  evaluation_processes: 1
tracking:
  mode: disabled
  project: SmartSOM
  group: v2诊断-stage3-check
resources:
  guard:
    max_worker_rss_gib: 12
    min_host_available_gib: 8
    min_disk_free_gib: 2
