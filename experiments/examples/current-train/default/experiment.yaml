# 工程示例（不是正式研究实验）
# 修改后运行 smartsom check；仅检查，不会启动实验。
# 入口：相对路径以本文件所在目录为起点
schema: smartsom.base-experiment/v1
scenario: ../../../../configs/scenarios/small.yaml
algorithm: ../../../../configs/algorithms/base-ppo.yaml

# 常改：训练种子与预算（Rule/evaluate 不需要训练预算）
train_seeds: 1  # 整数 N 表示从 101 开始的 N 个种子；列表表示显式种子

# 评估：checkpoint 节点、动作选择和验证安排
periodic_evaluation_cases: 4
test_cases: 4

# 执行：任务、并发和监控
run:
  task: train
  seed: 101
  seconds: 120  # 墙钟秒；null 不设该上限
  calibration: ../../../../runs/examples/current-calibrate/trials/default/seed-101/calibration.json
launch:
  mode: foreground

# 高级：物理时间边界与训练世界种子派生
train_ticks: 1000  # 单位：物理 tick；train_episodes 非空时由 episode 预算优先

# 单任务采样；保持原来的单环境训练行为
sampling:
  num_envs: 1
  processes: 0
  fragment_ticks: 256  # 仅开启片段更新时使用
